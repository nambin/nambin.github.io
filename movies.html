---
# Jekyll Front Matter
---

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nambin's Movie Log</title>
  <link rel="icon" type="image/svg+xml" href="/assets/beatles.svg">
  <style>
    * {
      box-sizing: border-box;
    }

    .movie-list {
      padding: 0;
      max-width: 652px;
    }

    .movie-card {
      /* Hide card initially for filtering. */
      display: none;

      align-items: flex-start;
      margin-bottom: 1rem;
      padding: 1.5rem;
      border: 1px solid #eee;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .movie-poster {
      width: 120px;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 1.5rem;
    }

    .movie-info {
      /* allows the container to shrink */
      min-width: 0;
    }

    .movie-info h2 {
      margin: 0 0 0.5rem 0;
      /* To avoid horizontal scroll for long titles (e.g., BlacKkKlansman) */
      overflow-wrap: break-word;
    }

    .movie-info h2 a {
      text-decoration: none;
      color: #2c3e50;
    }

    .movie-info h2 a:hover {
      text-decoration: underline;
    }

    .movie-info p {
      margin: 0.25rem 0;
      color: #555;
    }

    .director-filter-link {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    .director-filter-link:hover {
      text-decoration: underline;
      cursor: pointer;
    }

    .movie-badges {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-link {
      width: 28px;
      height: 28px;
    }

    .badge-icon {
      width: 28px;
      height: 28px;
    }

    #filter-display {
      justify-content: space-between;
      align-items: center;
      
      background-color: #eef7ff;
      border: 1px solid #cce4ff;
      border-radius: 8px;
      padding: 6px 15px;
      margin-bottom: 0.5rem;
      max-width: 652px;
      width: 100%;
    }

    #clear-filter {
      color: #555;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: bold;
      margin-left: 1rem;
      line-height: 1;
    }
    
    #clear-filter:hover {
      color: #000;
    }

    .search-container {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.2rem 0;
      max-width: 652px;
      display: flex;
      gap: 0.5rem;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    #recentToggle {
      flex-shrink: 0;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fff;
      color: #555;
      cursor: pointer;
    }

    #recentToggle:hover {
      border-color: #3498db;
      color: #3498db;
    }

    #recentToggle.active {
      background: #3498db;
      border-color: #3498db;
      color: #fff;
    }
  </style>
</head>

<body>
  <h1>Nambin's Movie Log</h1>

  <div id="filter-display" style="display: none;">
    <span id="filter-text"></span>
    <a href="/movies.html" id="clear-filter" title="Clear filter">&times;</a>
  </div>
  <div class="search-container">
    <button type="button" id="recentToggle" aria-pressed="false" title="Show only movies added in the last year">Recent</button>
    <input type="search" id="searchInput" placeholder="Search by title, director, year, lanuguage, awards ..."
      aria-label="Search movies">
  </div>
  <ul class="movie-list">
    <li class="empty-state">Loading movies…</li>
  </ul>

  <script>
    {% include movies.js %}
  </script>
  <script type="module" src="/assets/movies_page.js"></script>
</body>

<footer>
  <p>
    This product uses the TMDb API but is not endorsed or certified by TMDb.
  </p>
  <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">
    <img
      src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg"
      alt="The Movie Database" style="width: 80px;">
  </a>
</footer>

</html>
